# =============================================================================
# nginx: hangman.mnavasardian.com, the app's old domain. Every request is redirected
# permanently to https://hangman.eapps.site, path and query included, so shared challenge
# links (?c=…) and search results keep working. Install to
# /etc/nginx/sites-available/hangman.mnavasardian.com.conf and symlink into sites-enabled.
#
# The HTTPS block reuses the existing certificate under /etc/letsencrypt/live/hangman.mnavasardian.com/.
# Keep it renewing for as long as the redirect should work.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name hangman.mnavasardian.com;
    server_tokens off;

    # Certificate renewals (HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Same rules as hangman.eapps.site: no API over plain HTTP, and only page loads are redirected
    location ~ ^/(getWord|monitoring)(/|$) {
        return 403;
    }

    location / {
        if ($request_method !~ ^(GET|HEAD)$) {
            return 403;
        }
        return 301 https://hangman.eapps.site$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hangman.mnavasardian.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/hangman.mnavasardian.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hangman.mnavasardian.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        return 301 https://hangman.eapps.site$request_uri;
    }
}
