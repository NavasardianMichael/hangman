# =============================================================================
# nginx: hangman.mnavasardian.com (Next.js). Install to
# /etc/nginx/sites-available/hangman.mnavasardian.com.conf and symlink into sites-enabled.
# Paths assume APP_DIR=/home/michael/apps/hangman.
#
# The HTTPS block names files under /etc/letsencrypt/live/hangman.mnavasardian.com/.
# Get the certificate first (docs/DEPLOYMENT.md), or `nginx -t` fails with "No such file".
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name hangman.mnavasardian.com;

    # Certificate renewals (HTTP-01)
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name hangman.mnavasardian.com;
    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/hangman.mnavasardian.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hangman.mnavasardian.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Hashed, immutable build assets (JS, CSS, fonts), served straight off disk. The path runs
    # through `current`, so a release swap is picked up with no nginx reload.
    location /_next/static/ {
        alias /home/michael/apps/hangman/current/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else goes to Node: pages, POST /getWord, /_next/image (the optimizer, not a
    # static path), /sw.js and the manifest (their no-cache headers come from next.config.ts).
    # Never add proxy_cache here: /sw.js must always be fresh, and /getWord answers per request.
    location / {
        proxy_pass http://127.0.0.1:9005;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        # Required: /getWord rate-limits per client IP and reads it from X-Real-IP
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Next streams RSC payloads; buffering them delays the first paint
        proxy_buffering off;

        # /getWord waits for Gemini, falling back across models and retrying
        proxy_read_timeout 60s;
    }

    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml application/manifest+json image/svg+xml;
    gzip_min_length 256;
}
